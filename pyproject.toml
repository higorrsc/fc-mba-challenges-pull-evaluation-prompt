[project]
name = "pull-evaluation-prompt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "langchain==0.3.13",
  "langchain-community==0.3.13",
  "langchain-core==0.3.28",
  "langchain-google-genai==2.0.8",
  "langchain-openai==0.2.14",
  "langsmith==0.2.7",
  "pydantic==2.10.4",
  "python-dotenv==1.0.1",
  "pyyaml==6.0.2",
]

[dependency-groups]
dev = [
  "invoke>=2.2.0",
  "ipykernel>=6.30.1",
  "ipython>=9.5.0",
  "mypy>=1.18.2",
  "pyclean>=3.1.0",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "pytest-mock>=3.15.1",
  "pytest==8.3.4",
  "ruff>=0.14.4",
  "types-pyyaml>=6.0.12.20260510",
]

# ------------------------------------------------------
# Mypy
# ------------------------------------------------------

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
disallow_untyped_defs = false
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true

# ------------------------------------------------------
# Ruff
# ------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: import sort
# W: warnings
# B: bugbear
# UP: pyupgrade
# N: naming
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = []

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

# ------------------------------------------------------
# Pytest
# ------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = "."
python_files = "tests.py tests_*.py *tests.py test.py *_test.py test_*.py"
addopts = "-v --import-mode=importlib"
testpaths = "tests"
filterwarnings = []
