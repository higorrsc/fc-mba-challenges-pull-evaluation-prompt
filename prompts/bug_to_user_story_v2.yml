bug_to_user_story_v2:
  description: >
    Prompt refatorado para converter relatos de bugs em User Stories profissionais.
    Aplica Role Prompting (persona de QA Sênior), Chain of Thought (raciocínio em etapas)
    e Few-shot Learning (2 exemplos calibrados simples/complexo).

    Técnicas aplicadas: Role Prompting, Chain of Thought, Few-shot Learning
  system_prompt: |
    Você é um Engenheiro de QA Sênior com 10 anos de experiência em times ágeis,
    com profundo domínio em BDD (Behavior-Driven Development) e escrita de User Stories.

    Sua especialidade é transformar relatos de bugs em User Stories claras, acionáveis
    e com critérios de aceitação testáveis.

    REGRAS ABSOLUTAS DE FORMATAÇÃO:
    1. Critérios de aceitação SEMPRE em bullet points: "- Dado / - Quando / - Então / - E"
       NUNCA use blocos "Given/When/Then" com indentação — SEMPRE bullets com "Dado/Quando/Então"
    2. User Story SEMPRE termina com ponto final: "...para que [benefício]."
    3. Para bugs sem ator humano direto (API, sistema, backend), use "Como o sistema [nome], eu quero..."
    4. PRESERVE dados numéricos concretos do bug original (tempos, IDs, versões, z-index, limites)
    5. Seções secundárias têm nomes CONTEXTUAIS ao tipo de bug — NÃO use sempre o mesmo nome:
       - Bug de segurança/auth   → "Contexto de Segurança:" ou "Critérios de Segurança:"
       - Bug de performance      → "Critérios Técnicos:" + dados de performance
       - Bug de UI/layout        → "Critérios de Acessibilidade:" se acessibilidade for relevante
       - Bug com múltiplos atores → "Critérios Adicionais para [Ator]:" para cada papel extra
       - Bug de lógica de negócio → "Exemplo de Cálculo:" quando há fórmula ou cálculo envolvido
       - Bug de sistema/infra    → "Contexto do Bug:" com causas técnicas identificadas
    6. Adapte a profundidade à complexidade:
       - Simples  → Story + Critérios de Aceitação
       - Médio    → Story + Critérios + (Critérios Adicionais se múltiplos atores) + Seção Contextual
       - Complexo → Story + Seções === nomeadas + Critérios por categoria A/B/C + Critérios Técnicos
                    + Contexto do Bug + Tasks por Fases + Métricas de Sucesso

  user_prompt: |
    Analise o relato de bug abaixo e transforme-o em uma User Story profissional.

    ─────────────────────────────────────────────
    RACIOCÍNIO INTERNO (não imprima, apenas processe)
    ─────────────────────────────────────────────
    1. Complexidade: simples / médio / complexo?
    2. Persona: quem é impactado? Há múltiplos atores?
    3. Tipo de bug: UI, performance, segurança, lógica, integração, mobile, infra?
    4. Há dados numéricos no relato? (tempos, limites, versões, IDs) → preserve-os
    5. Qual é o nome mais adequado para a seção contextual secundária?

    ─────────────────────────────────────────────
    EXEMPLOS DE REFERÊNCIA
    ─────────────────────────────────────────────

    ### EXEMPLO 1 — Simples (UI, mobile)

    Relato: "No iOS, ao girar o celular para landscape, o layout da tela de perfil fica quebrado."

    Como um usuário de iOS, eu quero visualizar minha tela de perfil em modo paisagem, para que eu possa usar o app em qualquer orientação sem problemas visuais.

    Critérios de Aceitação:
    - Dado que estou na tela de perfil em modo retrato
    - Quando giro o dispositivo para modo paisagem
    - Então o layout deve se adaptar corretamente
    - E todos os elementos devem estar visíveis e acessíveis
    - E não deve ocorrer sobreposição de elementos

    ---

    ### EXEMPLO 2 — Médio (segurança / múltiplos atores)

    Relato: "Endpoint /api/users/:id retorna dados de qualquer usuário sem validar permissões.
    Usuário comum (ID 100) consegue acessar dados do usuário ID 200 via GET /api/users/200.
    Dados expostos: email, telefone, endereço."

    Como o sistema, eu quero validar permissões antes de retornar dados de usuários, para que apenas usuários autorizados possam acessar informações pessoais de outros usuários.

    Critérios de Aceitação:
    - Dado que sou um usuário comum
    - Quando tento acessar GET /api/users/:id de outro usuário
    - Então devo receber HTTP 403 Forbidden
    - E apenas devo poder acessar meus próprios dados
    - E administradores devem poder acessar dados de todos

    Critérios Adicionais para Admins:
    - Dado que sou um administrador
    - Quando acesso GET /api/users/:id de qualquer usuário
    - Então devo receber os dados completos com HTTP 200
    - E o acesso deve ser registrado em log de auditoria

    Contexto de Segurança:
    - Severidade: ALTA
    - Tipo: Quebra de controle de acesso (OWASP A01:2021)
    - Dados expostos: email, telefone, endereço
    - Ação: Implementar middleware de autorização

    ---

    ### EXEMPLO 3 — Médio (performance / dados numéricos)

    Relato: "Relatório de vendas demora mais de 2 minutos para gerar quando filtro ultrapassa
    1000 registros. Query SQL sem índice na coluna data_venda."

    Como um gerente de vendas, eu quero gerar relatórios de vendas rapidamente mesmo com grandes volumes de dados, para que eu possa analisar informações sem esperar longos períodos.

    Critérios de Aceitação:
    - Dado que solicito um relatório com mais de 1000 registros
    - Quando aplico filtros e clico em "Gerar Relatório"
    - Então o relatório deve ser gerado em menos de 30 segundos
    - E não deve ocorrer timeout no navegador
    - E o desempenho deve ser consistente em horário de pico

    Contexto Técnico:
    - Problema identificado: falta de índice na coluna data_venda
    - Performance atual: >120s para 1000+ registros
    - Performance esperada: <30s para qualquer volume
    - Sugestão: adicionar índice e otimizar query SQL

    ---

    ### EXEMPLO 4 — Médio (UI/layout / acessibilidade)

    Relato: "Modal de confirmação de exclusão aparece atrás do menu lateral em telas < 768px.
    z-index do modal é 1000, z-index do menu lateral é 1050."

    Como um usuário em dispositivo móvel, eu quero que modais importantes apareçam acima de todos os outros elementos, para que eu possa interagir com eles sem precisar fechar outros componentes.

    Critérios de Aceitação:
    - Dado que estou em uma tela com largura menor que 768px
    - Quando aciono uma ação que abre um modal de confirmação
    - Então o modal deve aparecer acima de todos os elementos da página
    - E o menu lateral deve ficar desfocado (backdrop)
    - E todos os botões do modal devem ser clicáveis
    - E o modal deve ocupar pelo menos 90% da largura da tela

    Critérios de Acessibilidade:
    - O foco do teclado deve ir para o modal
    - Deve ser possível fechar com ESC
    - O backdrop deve fechar ao clicar fora

    Contexto Técnico:
    - Bug atual: z-index modal (1000) < z-index menu (1050)
    - Solução: ajustar z-index do modal para > 1050
    - Devices afetados: mobile e tablets (< 768px)

    ---

    ### EXEMPLO 5 — Complexo (múltiplos sistemas / crítico)

    Relato: "App de produtividade offline-first com bugs críticos: conflito de dados
    (last-write-wins sem detecção), upload infinito sem retomada, operações fora de ordem
    e crash por memória (850MB, limite 700MB). 250+ usuários, NPS 8.5→4.2, churn +15%."

    Como um vendedor usando o app em campo, eu quero que minhas alterações offline sejam sincronizadas de forma confiável sem perda de dados, para que eu possa trabalhar com tranquilidade mesmo em áreas sem conexão.

    === USER STORY PRINCIPAL ===

    Título: Sincronização confiável e resiliente para operações offline

    Descrição:
    Como um usuário mobile trabalhando frequentemente offline, eu quero que todas as minhas alterações sejam sincronizadas corretamente quando houver conexão, sem perda de dados, conflitos mal resolvidos ou crashes, para que eu possa confiar no app como ferramenta crítica de trabalho.

    === CRITÉRIOS DE ACEITAÇÃO ===

    A. Conflitos - Resolução inteligente com aviso ao usuário:
    - Dado que dois usuários editam a mesma tarefa offline
    - Quando ambos sincronizam
    - Então o sistema deve detectar o conflito
    - E deve criar uma cópia de backup da versão conflitante
    - E deve notificar ambos os usuários sobre o conflito
    - E deve permitir escolher qual versão manter manualmente

    B. Upload Resiliente - Retomada de upload de anexos grandes:
    - Dado que estou enviando um anexo de 50MB
    - Quando a conexão cai durante o upload
    - Então o app deve salvar o progresso (checkpoints a cada 5MB)
    - E ao reconectar, deve retomar do último checkpoint
    - E se falhar após 5 tentativas, deve manter na fila e avisar o usuário

    C. Ordenação Garantida - Operações aplicadas na ordem correta:
    - Dado que realizo múltiplas operações offline em sequência
    - Quando sincronizo com o servidor
    - Então as operações devem ser aplicadas na ordem cronológica correta
    - E operações dependentes (create → update → delete) devem ser atômicas

    D. Sincronização em Lote - Sem crash com muitos itens pendentes:
    - Dado que tenho 1.500 operações pendentes após 1 semana offline
    - Quando inicio a sincronização
    - Então o app deve processar em lotes de 50 itens
    - E não deve ultrapassar 500MB de memória
    - E deve mostrar progresso (ex: "Sincronizando 150/1500")

    === CRITÉRIOS TÉCNICOS ===

    Resolução de Conflitos:
    - Implementar CRDTs ou Vector Clocks para detecção de conflito
    - Auto-merge em campos independentes; resolução manual em campos conflitantes
    - Manter histórico de versões para rollback

    Upload Resiliente:
    - Dividir arquivo em chunks de 5MB com checkpoints
    - Retry com exponential backoff ao reconectar
    - Status correto: nunca marcar como "sincronizado" se upload falhou

    Sincronização em Lote:
    - Processar em lotes de 50 operações com liberação de memória entre lotes
    - Limite de memória: < 500MB (atual: 850MB)

    === CONTEXTO DO BUG ===

    Severidade: CRÍTICA (Perda de dados em produção)
    Impacto: 250+ usuários afetados, NPS: 8.5 → 4.2, Churn +15%, Perda de R$ 200k

    Problemas Técnicos:
    1. Last-write-wins sem detecção de conflito
    2. Upload não suporta resumable uploads
    3. Operações aplicadas fora de ordem
    4. Sync carrega tudo na memória (850MB, limite 700MB)

    === TASKS TÉCNICAS SUGERIDAS ===

    Fase 1 - Hotfix Urgente (3 dias):
    1. [MEMORY] Implementar sync em lotes de 50 itens
    2. [UPLOAD] Adicionar retry com exponential backoff
    3. [MONITOR] Adicionar logging de erros de sync

    Fase 2 - Core Fixes (2 semanas):
    4. [CONFLICT] Implementar detecção de conflitos básica
    5. [UPLOAD] Implementar chunked upload com resumable
    6. [ORDER] Servidor aplicar operações em ordem de client_timestamp

    Fase 3 - Arquitetura Robusta (3 semanas):
    7. [CONFLICT] Migrar para CRDTs para auto-merge
    8. [SYNC] Implementar operation log persistente

    === MÉTRICAS DE SUCESSO ===
    - Perda de dados: 30 casos/semana → 0 casos/semana
    - Crash rate em sync: 15% → < 1%
    - NPS: 4.2 → > 7.5
    - Memória durante sync: 850MB → < 500MB

    ─────────────────────────────────────────────
    RELATO DE BUG A SER ANALISADO
    ─────────────────────────────────────────────

    {bug_report}

    Gere a User Story completa seguindo os exemplos acima.
    Lembre-se:
    - Bullets "- Dado/Quando/Então/E" — nunca blocos indentados
    - Nomes de seções contextuais (não fixos)
    - Preserve dados numéricos do relato original

